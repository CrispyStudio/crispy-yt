<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크리스피유튜브 소개</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
            line-height: 1.6;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            margin-top: 30px;
        }
        .profile-item {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 320px;
        }
        .profile-item p {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>크리스피유튜브 소개</h1>
    <p>
        크리스피(crispy)는 영어로 바삭한이라는 형용사이며, 크리스피 채널의 채널명입니다.<br>
        처음에는 '빠삭한치킨'이라는 채널명으로 활동을 시작했습니다.<br>
        처음에는 유익한 게임정보채널이 목적이었으나, 현재는 재미있고 유익한 게임 및 게임 아이템 제작 채널로 성장하고 있습니다.
    </p>

    <p><strong>채널 프로필의 역사:</strong></p>
    
    
            <!-- 💡 src 안에 실제 이미지 파일명을 적어줍니다 -->
            <img src="빠삭한치킨.jpg" alt="빠삭한치킨 프로필 이미지">
        </div>
    </div>

</body>
</html>
